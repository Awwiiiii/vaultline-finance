name: Build and Push Multi-Service
on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: .                # Use the repository root as context
          file: ./frontend/Dockerfile # Explicitly point to the file path
          push: true
          # Note: 'vaultline-web' must match your deployment.yaml image name
          tags: awi2005/vaultline-web:latest

      - name: Build and Push Backend (API)
        uses: docker/build-push-action@v4
        with:
          context: .                # Use the repository root as context
          file: ./backend/Dockerfile  # Explicitly point to the file path
          push: true
          tags: awi2005/vaultline-api:latest