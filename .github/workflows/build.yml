name: Build and Push Multi-Service

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- FRONTEND ----------
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: awi2005/vaultline-web:latest

      # ---------- LEDGER SERVICE ----------
      - name: Build and Push Ledger Service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/ledger-service
          file: ./backend/ledger-service/Dockerfile
          push: true
          tags: awi2005/vaultline-ledger:latest

      # ---------- AUTH SERVICE ----------
      - name: Build and Push Auth Service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/auth-service
          file: ./backend/auth-service/Dockerfile
          push: true
          tags: awi2005/vaultline-auth:latest
