global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8000"]

  - job_name: "ledger-service"
    static_configs:
      - targets: ["ledger-service:5000"]

  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:80"]
