<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VaultLine Finance</title>

<style>

:root{
--accent:#00ff88;
--bg:#0a0a0a;
--card:#161616;
}

body{
font-family:Segoe UI;
background:var(--bg);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

.dashboard{
width:420px;
padding:30px;
background:var(--card);
border-radius:18px;
border:1px solid #333;
text-align:center;
}

h1{
color:var(--accent);
margin-bottom:5px;
}

.status{
font-size:11px;
color:var(--accent);
margin-bottom:15px;
}

.balance{
font-size:42px;
margin:10px 0;
}

input{
padding:8px;
margin:5px;
border-radius:6px;
border:1px solid #444;
background:#111;
color:white;
}

button{
padding:8px 15px;
border-radius:6px;
border:none;
background:var(--accent);
cursor:pointer;
font-weight:bold;
}

.tx{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #222;
font-size:14px;
}

.tx-note{
color:#aaa;
}

.tx-amount{
color:var(--accent);
font-weight:bold;
}

</style>
</head>

<body>

<div class="dashboard">

<h1>VaultLine Finance</h1>
<div id="status" class="status">Not Connected</div>

<div id="login-box">

<input id="username" placeholder="Username">
<input id="password" placeholder="Password" type="password">

<br><br>

<button onclick="login()">Login</button>

</div>

<h4>Available Balance</h4>
<div id="balance" class="balance">$0.00</div>

<div>Account Holder: <span id="user">---</span></div>

<br>

<div id="transactions"></div>

<br>

<button onclick="fetchAccount()">Refresh</button>

</div>

<script>

const AUTH_API = "http://localhost:8001/login"
const LEDGER_API = "http://localhost:8000/api/v1/account/"

async function login(){

const username = document.getElementById("username").value
const password = document.getElementById("password").value

if(!username || !password){
alert("Enter username and password")
return
}

try{

const res = await fetch(AUTH_API,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:username,
password:password
})
})

if(!res.ok){
throw new Error("Login failed")
}

const data = await res.json()

localStorage.setItem("token",data.access_token)
localStorage.setItem("user",username)

document.getElementById("status").innerText="Authenticated"

fetchAccount()

}catch(err){

console.error(err)

document.getElementById("status").innerText="Login Error"

}

}

async function fetchAccount(){

const token = localStorage.getItem("token")
const user = localStorage.getItem("user")

if(!token || !user){
document.getElementById("status").innerText="Login Required"
return
}

try{

const res = await fetch(LEDGER_API+user,{
headers:{
"Authorization":"Bearer "+token
}
})

if(!res.ok){
throw new Error("API Error")
}

const data = await res.json()

document.getElementById("balance").innerText =
"$"+Number(data.balance).toLocaleString()

document.getElementById("user").innerText = data.owner

document.getElementById("status").innerText = data.db_status

const txBox = document.getElementById("transactions")

txBox.innerHTML=""

if(data.transactions){

data.transactions.forEach(tx=>{

const div=document.createElement("div")

div.className="tx"

div.innerHTML=
`<span class="tx-note">${tx.note}</span>
<span class="tx-amount">$${tx.amount}</span>`

txBox.appendChild(div)

})

}

}catch(err){

console.error(err)

document.getElementById("status").innerText="API ERROR"

}

}

/* auto reload session */

window.onload=()=>{

const token = localStorage.getItem("token")

if(token){
fetchAccount()
}

}

</script>

</body>
</html>
